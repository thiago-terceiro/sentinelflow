name: sentinelflow-ci

on:
  pull_request:
    paths:
      - "sentinelflow/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/validate-sentinelflow.sh"
  push:
    branches:
      - main
    paths:
      - "sentinelflow/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/validate-sentinelflow.sh"

permissions:
  contents: read

jobs:
  backend-validate:
    name: backend-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run backend validation
        run: bash .github/scripts/validate-sentinelflow.sh backend

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Run frontend validation
        run: bash .github/scripts/validate-sentinelflow.sh frontend

  # TODO: migrations should follow expand → migrate → contract.
  database-migrate:
    name: database-migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend-validate
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Verify database URL is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured in the production GitHub environment."
            exit 1
          fi

      - name: Sync backend dependencies
        working-directory: sentinelflow/backend
        run: uv sync

      - name: Run database migrations
        working-directory: sentinelflow/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head
