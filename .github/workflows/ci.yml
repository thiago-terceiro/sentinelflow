name: sentinelflow-ci

on:
  pull_request:
    paths:
      - "sentinelflow/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/validate-sentinelflow.sh"
  push:
    branches:
      - main
      - master
    paths:
      - "sentinelflow/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/validate-sentinelflow.sh"

permissions:
  contents: read

jobs:
  backend-validate:
    name: backend-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Run backend validation (lint, test, evals)
        run: bash .github/scripts/validate-sentinelflow.sh backend

  frontend-validate:
    name: frontend-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "sentinelflow/frontend/pnpm-lock.yaml"

      - name: Run frontend validation (test, build)
        run: bash .github/scripts/validate-sentinelflow.sh frontend

  contract-drift-check:
    name: contract-drift-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "sentinelflow/frontend/pnpm-lock.yaml"

      - name: Install dependencies
        run: |
          cd sentinelflow/backend && uv sync --extra dev
          cd ../frontend && pnpm install

      - name: Verify OpenAPI & TypeScript schema synchronization
        run: bash .github/scripts/validate-sentinelflow.sh contract

  # Continuous delivery database migrations
  database-migrate:
    name: database-migrate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [backend-validate, frontend-validate, contract-drift-check]
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Verify database URL is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured in the production GitHub environment."
            exit 1
          fi

      - name: Sync backend dependencies
        working-directory: sentinelflow/backend
        run: uv sync

      - name: Run database migrations
        working-directory: sentinelflow/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head
