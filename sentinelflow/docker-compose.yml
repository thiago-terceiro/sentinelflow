services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinelflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-init:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      SEED_DEMO_DATA: "true"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sentinelflow
      LANGGRAPH_CHECKPOINT_URL: postgresql://postgres:postgres@postgres:5432/sentinelflow
      QUEUE_REDIS_URL: redis://redis:6379/0
      AUTH_ISSUER: sentinelflow-dev
      AUTH_AUDIENCE: sentinelflow-api
      AUTH_JWT_SECRET: change-me
      AUTH_ALLOW_DEV_TOKENS: "true"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && if [ \"$${SEED_DEMO_DATA:-true}\" = \"true\" ]; then python -m app.db.seed; fi",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENABLE_API_DOCS: "true"
      ALLOWED_HOSTS: '["localhost","127.0.0.1","proxy","backend"]'
      CORS_ALLOWED_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sentinelflow
      LANGGRAPH_CHECKPOINT_URL: postgresql://postgres:postgres@postgres:5432/sentinelflow
      QUEUE_REDIS_URL: redis://redis:6379/0
      AUTH_ISSUER: sentinelflow-dev
      AUTH_AUDIENCE: sentinelflow-api
      AUTH_JWT_SECRET: change-me
      AUTH_ALLOW_DEV_TOKENS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      backend-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/ready').read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sentinelflow
      LANGGRAPH_CHECKPOINT_URL: postgresql://postgres:postgres@postgres:5432/sentinelflow
      QUEUE_REDIS_URL: redis://redis:6379/0
      AUTH_ISSUER: sentinelflow-dev
      AUTH_AUDIENCE: sentinelflow-api
      AUTH_JWT_SECRET: change-me
      AUTH_ALLOW_DEV_TOKENS: "true"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      backend-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      APP_ENV: development
      INTERNAL_API_BASE_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      INTERNAL_ACCESS_TOKEN_COOKIE_NAME: sentinelflow_access_token
      INTERNAL_ID_TOKEN_COOKIE_NAME: sentinelflow_id_token
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_DISCOVERY_URL: ${AUTH_OIDC_DISCOVERY_URL:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_OIDC_SCOPE: ${AUTH_OIDC_SCOPE:-openid profile email}
      AUTH_OIDC_CALLBACK_PATH: ${AUTH_OIDC_CALLBACK_PATH:-/auth/callback}
      AUTH_POST_LOGIN_PATH: ${AUTH_POST_LOGIN_PATH:-/}
      AUTH_POST_LOGOUT_PATH: ${AUTH_POST_LOGOUT_PATH:-/}
      DEPLOYMENT_VERSION: local-docker
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      worker:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>{if(!r.ok) process.exit(1)})"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
        restart: true
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  postgres_data:
