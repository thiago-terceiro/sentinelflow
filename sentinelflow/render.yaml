# Render Blueprint — SentinelFlow free-tier deployment
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO USE:
#   1. Push this repo to GitHub.
#   2. In Render dashboard → New → Blueprint → connect your repo.
#      When asked for the render.yaml location, enter: sentinelflow/render.yaml
#   3. After the first deploy, set the five secrets marked "sync: false" in the
#      Render dashboard under sentinelflow-backend → Environment:
#        DATABASE_URL            (Supabase: postgresql+asyncpg://...)
#        LANGGRAPH_CHECKPOINT_URL (Supabase: postgresql://...)
#        OPENAI_API_KEY          (your inference provider key)
#        OTEL_EXPORTER_OTLP_ENDPOINT  (e.g., Grafana Cloud OTLP endpoint)
#        OTEL_EXPORTER_OTLP_HEADERS   (e.g., Authorization=Basic <base64>)
#   4. Update CORS_ALLOWED_ORIGINS once you know your Vercel URL (see step 5).
#   5. Deploy frontend to Vercel (see sentinelflow/frontend/vercel.json).

services:
  - type: web
    name: sentinelflow-backend
    runtime: docker
    rootDir: /sentinelflow
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    # preDeployCommand is not supported in the Render's free plan, if using paid plan uncomment below and update ci.yml
    # preDeployCommand: alembic upgrade head    
    envVars:
      # ── App ──────────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "8000"
      - key: ENABLE_API_DOCS
        value: "true"

      # ── Host / CORS ───────────────────────────────────────────────────────
      # Wildcards work with Starlette TrustedHostMiddleware.
      - key: ALLOWED_HOSTS
        value: '["*.onrender.com","localhost","127.0.0.1"]'
      # IMPORTANT: replace with your real Vercel URL after frontend is deployed,
      # then redeploy the backend service.
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://frontend-five-flame-66.vercel.app/"]'

      # ── Database (Supabase — already provisioned) ────────────────────────
      # Values are in sentinelflow/.deployment-secrets.txt (gitignored).
      # Set these in the Render dashboard → sentinelflow-backend → Environment.
      - key: DATABASE_URL
        sync: false
      - key: LANGGRAPH_CHECKPOINT_URL
        sync: false

      # ── Redis (Render managed, auto-wired) ──────────────────────────────
      - key: QUEUE_REDIS_URL
        fromService:
          type: redis
          name: sentinelflow-redis
          property: connectionString

      # ── Auth ─────────────────────────────────────────────────────────────
      - key: AUTH_ISSUER
        value: https://fmteujlopnckukroopfz.supabase.co
      - key: AUTH_AUDIENCE
        value: authenticated
      - key: AUTH_OIDC_ISSUER
        value: https://fmteujlopnckukroopfz.supabase.co
      - key: AUTH_OIDC_DISCOVERY_URL
        value: https://fmteujlopnckukroopfz.supabase.co/.well-known/openid-configuration
      - key: AUTH_JWKS_URL
        value: https://fmteujlopnckukroopfz.supabase.co/.well-known/jwks.json
      # Render generates a cryptographically random secret automatically.
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_ALLOW_DEV_TOKENS
        value: "false"

      # ── LLM ──────────────────────────────────────────────────────────────
      # Set in the Render dashboard.
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: openai/gpt-oss-120b:free

      # ── Telemetry (OTEL) ─────────────────────────────────────────────────
      # Set in the Render dashboard. Get a free OTLP endpoint from Grafana Cloud
      # (https://grafana.com/products/cloud/) or Honeycomb (https://honeycomb.io).
      # Example Grafana Cloud: endpoint=https://otlp-gateway-prod-us-east-0.grafana.net/v1/traces
      # headers=Authorization=Basic <base64(user:apiKey)>
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  # ── Worker-as-web-service (free-tier workaround) ─────────────────────────
  # Render's free plan has no background-worker type, so we run arq inside a
  # tiny FastAPI process (app/worker_server.py). Render health-checks /health
  # to keep the service alive; the arq worker runs as an asyncio task in the
  # FastAPI lifespan.
  - type: web
    name: sentinelflow-worker
    runtime: docker
    rootDir: /sentinelflow
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # Override the Dockerfile CMD to start the worker server instead of the API.
    dockerCommand: uvicorn app.worker_server:app --host 0.0.0.0 --port 8000 --proxy-headers
    envVars:
      # Use development to skip the production validator (no OTEL needed here).
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LANGGRAPH_CHECKPOINT_URL
        sync: false
      - key: QUEUE_REDIS_URL
        fromService:
          type: redis
          name: sentinelflow-redis
          property: connectionString
      # Shared with the backend so tokens are valid across both services.
      - key: AUTH_JWT_SECRET
        fromService:
          type: web
          name: sentinelflow-backend
          envVarKey: AUTH_JWT_SECRET
      - key: AUTH_ISSUER
        value: https://fmteujlopnckukroopfz.supabase.co
      - key: AUTH_AUDIENCE
        value: authenticated
      - key: AUTH_ALLOW_DEV_TOKENS
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: openai/gpt-oss-120b:free

  # ── Redis (Render free Key Value) ─────────────────────────────────────────
  - type: redis
    name: sentinelflow-redis
    region: frankfurt
    plan: free
    ipAllowList: []
