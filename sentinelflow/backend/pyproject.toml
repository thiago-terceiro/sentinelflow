[project]
name = "sentinelflow-backend"
version = "0.1.0"
description = "SentinelFlow dispute investigation backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "sqlalchemy>=2.0.43,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "alembic>=1.16.4,<2.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "pyjwt[crypto]>=2.15.0,<3.0.0",
  "httpx>=0.28.1,<1.0.0",
  "arq>=0.26.3,<1.0.0",
  "redis>=5.0.8,<6.0.0",
  "langgraph>=1.0.10,<2.0.0",
  "langgraph-checkpoint-postgres>=3.1.1,<4.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "langchain-core>=1.2.22,<2.0.0",
  "langchain-openai>=1.1.14,<2.0.0",
  "greenlet>=3.2.4,<4.0.0",
  "opentelemetry-api>=1.36.0,<2.0.0",
  "opentelemetry-sdk>=1.36.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36.0,<2.0.0",
  "orjson>=3.11.2,<4.0.0",
  "urllib3>=2.8.0,<3.0.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "onnxruntime>=1.17.0",
  "skl2onnx>=1.16.0",
  "scipy>=1.12.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "pytest-cov>=5.0.0,<8.0.0",
  "ruff>=0.12.8,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "mypy>=1.15.0,<2.0.0",
  "pip-audit>=2.9.0,<3.0.0",
  "bandit>=1.8.3,<2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "pytest-cov>=5.0.0,<8.0.0",
  "ruff>=0.12.8,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "mypy>=1.15.0,<2.0.0",
  "pip-audit>=2.9.0,<3.0.0",
  "bandit>=1.8.3,<2.0.0",
  "locust>=2.24.0",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
  "ignore:.*allowed_objects.*:Warning",
  "ignore:.*starlette.testclient.*:Warning",
  "ignore:.*httpx2.*:Warning",
]

[tool.ruff]
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101", "S105", "S106"]
"app/telecom/train_onnx_model.py" = ["E501"]


[tool.bandit]
exclude_dirs = ["app/tests", ".venv"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
