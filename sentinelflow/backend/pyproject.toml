[project]
name = "sentinelflow-backend"
version = "0.1.0"
description = "SentinelFlow dispute investigation backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "sqlalchemy>=2.0.43,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "alembic>=1.16.4,<2.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "pyjwt[crypto]>=2.10.1,<3.0.0",
  "httpx>=0.28.1,<1.0.0",
  "arq>=0.26.3,<1.0.0",
  "redis>=5.0.8,<9.0.0",
  "langgraph>=0.6.5,<1.0.0",
  "langgraph-checkpoint-postgres>=2.0.24,<3.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "langchain-core>=0.3.72,<1.0.0",
  "langchain-openai>=0.3.31,<1.0.0",
  "greenlet>=3.2.4,<4.0.0",
  "opentelemetry-api>=1.36.0,<2.0.0",
  "opentelemetry-sdk>=1.36.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36.0,<2.0.0",
  "orjson>=3.11.2,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "ruff>=0.12.8,<1.0.0",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
